[project]
name = "layadino"
version = "0.1.0"
description = "Chrome Dino Typed Decision Model Benchmark for Laya and Vega"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "laya>=0.4.8",
    "vegaml>=0.9.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
