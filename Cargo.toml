[package]
name = "laya-vega-benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fastrand = "2.0"

[lib]
name = "layadino"
path = "src/lib.rs"

[[bin]]
name = "laya-vega-benchmark"
path = "src/main.rs"
